<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>손글씨 숫자 인식기</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <!-- 상단 헤더 -->
    <header class="top-bar">
      <div class="brand">
        <div class="brand-icon" aria-hidden="true">7</div>
        <div>
          <h1>손글씨 숫자 인식기</h1>
          <p class="subtitle">손으로 숫자를 쓰거나 사진을 올리면 바로 읽어드려요</p>
        </div>
      </div>

      <div class="header-actions">
        <label class="btn btn-outline upload-btn" for="photoInput" title="종이에 쓴 숫자 사진 불러오기">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="5" width="18" height="14" rx="2" />
            <circle cx="8.5" cy="10.5" r="1.5" />
            <path d="M21 15l-5-5L5 19" />
          </svg>
          <span>사진 올리기</span>
        </label>
        <input type="file" id="photoInput" accept="image/*" hidden />

        <button type="button" id="themeToggle" class="btn btn-icon" aria-label="어두운 화면 전환" title="어두운 화면 전환">
          <svg id="iconMoon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
          </svg>
          <svg id="iconSun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" hidden>
            <circle cx="12" cy="12" r="5" />
            <line x1="12" y1="1" x2="12" y2="3" />
            <line x1="12" y1="21" x2="12" y2="23" />
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
            <line x1="1" y1="12" x2="3" y2="12" />
            <line x1="21" y1="12" x2="23" y2="12" />
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
          </svg>
        </button>
      </div>
    </header>

    <!-- 메인 작업 영역 (PC: 좌/우 분할, 모바일: 위/아래 분할) -->
    <main class="workspace">
      <!-- 왼쪽: 숫자 쓰는 공간 -->
      <section class="card draw-card" aria-label="숫자 쓰는 공간">
        <div class="card-header">
          <h2 class="card-title">숫자 쓰는 공간</h2>
          <label class="auto-toggle" title="글씨를 다 쓰고 잠시 멈추면 자동으로 숫자를 읽어요">
            <input type="checkbox" id="autoRecognizeToggle" checked />
            <span class="toggle-track"></span>
            <span class="toggle-label">자동 인식</span>
          </label>
        </div>

        <div class="canvas-wrapper" id="canvasWrapper">
          <canvas id="drawCanvas" aria-label="손글씨 숫자 입력 영역"></canvas>
          <div class="canvas-placeholder" id="canvasPlaceholder">
            <span>여기에 숫자(0~9)를 써보세요</span>
            <small>한 자리 숫자도, 2026 같은 여러 자리 숫자도 읽을 수 있어요</small>
          </div>
        </div>

        <!-- 필기 도구 모음 -->
        <div class="toolbar">
          <div class="tool-group" role="group" aria-label="펜 굵기 선택">
            <span class="tool-label">펜 굵기</span>
            <div class="thickness-pills">
              <button type="button" class="pill-btn" data-size="10" aria-pressed="false">얇게</button>
              <button type="button" class="pill-btn active" data-size="18" aria-pressed="true">보통</button>
              <button type="button" class="pill-btn" data-size="28" aria-pressed="false">굵게</button>
            </div>
          </div>

          <div class="tool-group tool-actions">
            <button type="button" id="eraserBtn" class="btn btn-soft" aria-pressed="false">
              지우개
            </button>
            <button type="button" id="undoBtn" class="btn btn-soft" disabled>
              되돌리기
            </button>
            <button type="button" id="clearBtn" class="btn btn-soft btn-danger-soft">
              전체 지우기
            </button>
          </div>
        </div>

        <button type="button" id="recognizeBtn" class="btn btn-primary btn-large">
          숫자 읽기
        </button>
      </section>

      <!-- 오른쪽: 인식결과 & 정확도 -->
      <section class="card result-card" aria-label="인식결과">
        <!-- "인식결과" 바로 옆에 정확도 값 표시 -->
        <div class="card-header result-header">
          <div class="result-title-row">
            <h2 class="card-title">인식결과</h2>
            <div class="accuracy-badge idle" id="accuracyBadge" aria-live="polite">
              <span class="accuracy-label">정확도</span>
              <strong id="accuracyValue">--%</strong>
            </div>
          </div>
        </div>

        <!-- 정확도 게이지 바 -->
        <div class="accuracy-bar-wrap" aria-hidden="true">
          <div class="accuracy-bar-fill" id="accuracyBarFill" style="width: 0%"></div>
        </div>

        <!-- 크게 표시되는 인식된 숫자 (직접 수정 가능) -->
        <div class="result-display-box">
          <input
            type="text"
            id="resultInput"
            class="result-input"
            inputmode="numeric"
            placeholder="?"
            aria-label="인식된 숫자 (직접 수정 가능)"
            autocomplete="off"
          />
          <p class="result-hint" id="resultHint">
            왼쪽에 숫자를 쓰면 여기에 크게 표시돼요
          </p>
        </div>

        <!-- 세부 분석 영역 (한 자리: 후보 숫자 비교 / 여러 자리: 각 자리별 정확도) -->
        <div class="detail-panel" id="detailPanel" hidden>
          <h3 class="detail-title" id="detailTitle">자세히 보기</h3>
          <div class="detail-content" id="detailContent"></div>
        </div>

        <!-- 결과 활용 버튼 -->
        <div class="result-actions">
          <button type="button" id="copyBtn" class="btn btn-primary" disabled>
            숫자 복사하기
          </button>
          <button type="button" id="saveHistoryBtn" class="btn btn-outline" disabled>
            기록에 남기기
          </button>
        </div>
      </section>
    </main>

    <!-- 최근 인식 기록 -->
    <section class="card history-card" aria-label="최근 인식 기록">
      <div class="card-header">
        <h2 class="card-title">최근 인식 기록</h2>
        <button type="button" id="clearHistoryBtn" class="btn-text" hidden>기록 비우기</button>
      </div>
      <div class="history-list" id="historyList">
        <p class="history-empty">아직 인식한 숫자가 없어요. 숫자를 쓰면 기록이 여기에 쌓여요.</p>
      </div>
    </section>

    <footer class="app-footer">
      입력한 손글씨와 사진은 내 기기 안에서만 처리되며 외부로 전송되지 않아요.
    </footer>
  </div>

  <!-- 친절한 알림 토스트 -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="mnist-model.js"></script>
  <script src="app.js"></script>
</body>
</html>
